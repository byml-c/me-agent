[project]
name = "me-agent"
version = "0.1.0"
description = "Graph-native personal agent MVP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "openai>=2.41.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["backend*"]
exclude = ["frontend*", "docs*"]

[project.optional-dependencies]
dev = [
  "httpx2>=0.28.0",
  "pytest>=8.0.0",
  "ruff>=0.6.0",
]

[project.scripts]
me-agent = "backend.app.cli:main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
